# Image tag — kept in lockstep with the API chart by CI (both render
# from the same Docker image).
version: "v41f487e"

# Top-level switch: when true, all rendered CronJobs are suspended.
# Default false. Useful for the non-prod pipeline that mirrors prod's
# paused state — flip to true to deploy ETLs in a dormant posture,
# false to resume.
cronjobsSuspended: false

# ─── PVC dependencies ───────────────────────────────────────────────
# Most ETLs don't touch a PVC — they download to memory or /tmp
# (ephemeral emptyDir, fine because every loader streams parses then
# emits to events.entity_events). Only the three SEC-EDGAR-adjacent
# loaders cache upstream filings on disk:
#
#   etl-us-companies     mounts /edgar-data (needsEdgarData=true)
#   etl-us-financials    mounts /edgar-data (needsEdgarData=true)
#   etl-eu-listings      mounts /esef-data  (needsEsefData=true)
#
# Both `edgar-data` and `esef-data` PVCs are owned by the **fontem-api
# main chart** (`deployment/templates/edgar-data-{pv,pvc}.yaml` and
# `esef-data-{pv,pvc}.yaml`); this ETL chart only references them by
# claim name. If you ever install deployment-etl without the main
# chart, the three cronjobs above will hang in PodInitializing —
# install the main chart first, or split the PVCs into a shared
# subchart.
# ────────────────────────────────────────────────────────────────────

# Virtuoso target for the sanctions ETL's RDF dual-write. When
# enabled, the sanctions cronjob picks up VIRTUOSO_SPARQL_ENDPOINT
# + VIRTUOSO_DBA_PASSWORD from the secret below and pushes Turtle
# to its default graph (http://data.fontem.eu/graph/sanctions) in
# addition to the legacy Neo4j writes.
virtuoso:
  enabled: false
  sparqlEndpoint: ""
  dbaPasswordSecret: virtuoso-credentials
  dbaPasswordKey: VIRTUOSO_DBA_PASSWORD

# Per-cronjob tuning. Today only the OpenFIGI loader exposes a runtime
# knob (its --limit caps how many IDs each scheduled run consumes).
# Default empty → loader uses its own internal default (10000/mode).
cronjobs:
  openfigi:
    limit: ""

# FIRDS-specific knobs. See cronjob-firds.yaml for the wiring.
#
# proxyEnabled — wires the cronjob to use the per-node tinyproxy
# (infra/esma-bypass-proxy role) so it can reach ESMA without the
# wireguard egress IP getting WAF'd. Default OFF: prod doesn't want
# daily Listing deltas landing yet. Staging flips this to true.
#
# since — passed as --since to the loader. Empty → use the loader's
# coded default (2025-09-01). Staging uses a recent date so we ingest
# only a few months of equity / fund Listings while validating the
# matching path; prod will use the full history when it turns on.
#
# cacheEnabled — mount the NFS-backed firds-cache PVC and tell the
# loader to skip re-downloading zips that are already on disk. DLTINS
# files are immutable so this is a pure-win cache. Default ON; flip
# to false for environments where the PVC isn't provisioned (eg the
# golden chart template tests).
firds:
  proxyEnabled: false
  since: ""
  cacheEnabled: true

# nodeSelector + tolerations propagate to every rendered CronJob via
# the _etl_cronjob.tpl helper. Prod pins to cluster-node-3-prod, non-prod
# leaves these empty.
nodeSelector: {}
tolerations: []

# ─── On-demand data-quality assertion Job ───────────────────────────
# Disabled by default: a normal chart sync must NOT run it. Render with
# --set dqAssert.enabled=true (+ a fresh runId) and apply on demand to
# gate a shared store after an ETL change. See templates/job-dq-assert.yaml.
#   family — optional subset: keys,refs,values,pipeline,freshness
#            (empty → run the whole catalog)
#   runId  — appended to the Job name so each run is a distinct object
dqAssert:
  enabled: false
  runId: "manual"
  family: ""
  deadlineSeconds: 600

# One-off TED contract backfill/re-ingest. Off by default; render with
# --set tedBackfill.enabled=true --set tedBackfill.year=2026
# --set tedBackfill.month=1 and apply per month to re-emit a month's
# notices (e.g. after a parser fix) into the event log. See
# templates/job-ted-backfill.yaml.
tedBackfill:
  enabled: false
  year: 2026
  month: 1
  rescore: true
  deadlineSeconds: 14400
