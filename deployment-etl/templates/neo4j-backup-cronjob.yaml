apiVersion: batch/v1
kind: CronJob
metadata:
  name: neo4j-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 1 1,15 * *"        # 1st and 15th of each month at 01:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # The backup PVC is local-path, so its PV is pinned to the node
          # Neo4j runs on (cluster-node-4), and that node carries the
          # production role taint. Neo4j tolerates it; this job did not,
          # so the pod stayed Pending with "didn't match PersistentVolume's
          # node affinity" even once its Secret references were fixed.
          # Matches the Neo4j deployment exactly — where the volume lives,
          # the writer has to be able to run.
          tolerations:
            - key: void42.internal/role
              operator: Equal
              value: prod
              effect: NoSchedule
          nodeSelector:
            node-role.kubernetes.io/production: ""
          containers:
            - name: backup
              image: neo4j:5-community
              imagePullPolicy: IfNotPresent
              env:
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_PASSWORD
                # From the secret, not hard-coded. The address used to be
                # written into the script as neo4j.gmr.svc.cluster.local;
                # the gmr namespace was renamed to fontem-prod and no
                # longer exists, so every scheduled backup connected to
                # nothing. Every other job in this chart already reads
                # NEO4J_URI from here, which is also why they survived
                # the rename and this one did not.
                - name: NEO4J_URI
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_URI
                # Kuma push URL lives in its own Secret so it isn't
                # plaintext in git. The kuma_push_url key holds a full
                # URL with the per-monitor token + ?status=up query.
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-backup-creds
                      key: kuma_push_url
                      # Optional on purpose. This Secret does not exist in
                      # fontem-prod, and a non-optional reference to a
                      # missing Secret stops the pod being created at all —
                      # so an absent *alerting* credential was preventing
                      # the backup itself from ever running. The script
                      # already treats the push as best-effort; the
                      # dependency has to point the same way.
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y%m%d-%H%M)
                  echo "Starting Neo4j backup ${DATE}..."

                  # Export via APOC (works on community edition)
                  cypher-shell -a "$NEO4J_URI" \
                    -u neo4j -p "$NEO4J_PASSWORD" \
                    "CALL apoc.export.cypher.all(null, {streamStatements:true, format:'cypher-shell'})" \
                    > /backup/${DATE}-full.cypher

                  gzip /backup/${DATE}-full.cypher
                  SIZE=$(du -sh /backup/${DATE}-full.cypher.gz | cut -f1)
                  echo "Backup saved: ${DATE}-full.cypher.gz (${SIZE})"

                  # Keep the last 3 backups
                  ls -t /backup/*.cypher.gz 2>/dev/null | tail -n +4 | xargs rm -f 2>/dev/null || true
                  echo "Backup complete. Files:"
                  ls -lh /backup/*.cypher.gz 2>/dev/null

                  # Notify Uptime Kuma — best effort, never fails the job.
                  # We use wget instead of curl because the neo4j:5-community
                  # base image does not ship curl. The previous version of
                  # this script used `curl ... || true` which silently
                  # swallowed "curl: not found" and meant Kuma never saw a
                  # single beat for ~6 days even though backups were green.
                  if wget -q -O- "${KUMA_PUSH_URL}" >/dev/null 2>&1; then
                    echo "[kuma] push OK"
                  else
                    echo "[kuma] push FAILED — backup itself succeeded; alerting is broken" >&2
                  fi
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - mountPath: /backup
                  name: backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: neo4j-backup
