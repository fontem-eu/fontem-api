{{- /*
EU listings + ESEF financials → events.entity_events.
Sinks own the projection — loader needs no Virtuoso credentials.
*/ -}}
{{- include "edgar-gmr-etl.cronjob" (dict
      "name"            "etl-eu-listings"
      "schedule"        "0 6 * * 0"
      "module"          "src.etl.load_eu_listings"
      "args"            (list)
      "deadlineSeconds" 7200
      "cpuRequest"      "250m"
      "cpuLimit"        "1"
      "memRequest"      "1Gi"
      "memLimit"        "3Gi"
      "extraEnv"        (list)
      "needsEsefData"   true
      "Values"          .Values
      "Release"         .Release) -}}
