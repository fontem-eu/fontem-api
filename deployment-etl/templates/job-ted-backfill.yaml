{{/*
TED contract backfill / re-ingest Jobs — one per month range.

Same image + secrets as the etl-ted-contracts CronJob, but one-shot Jobs
that walk a range of monthly archives through the ONE ingest path
(src.etl.load_ted_contracts --from YYYY-MM --to YYYY-MM). Emit-only: the
loader writes events.entity_events; the sinks materialise them. Since
the single-ingest-path change the loader skips every notice the graph
already holds at its current version with its identity stamped, so a
plain re-run is exactly the identity repair: only notices the old
archive path wrote without a procedure id / publication number are
re-emitted. `rescore: true` bypasses that skip and re-emits everything
in the range (needed once for the eForms era, whose modification
notices carry the back-link in the wrong field).

Values:

  tedBackfill:
    enabled: true
    ranges:
      - {from: "2019-01", to: "2019-12"}
      - {from: "2024-01", to: "2024-12", rescore: true}
    deadlineSeconds: 172800

Each Job is named by its range so ranges don't collide; edit or remove
a range to re-run. The legacy single-month form (year/month/rescore)
still renders one Job. Always run against fontem-shared (staging)
first — never prod directly.
*/}}
{{- if .Values.tedBackfill.enabled }}
{{- $ranges := list }}
{{- range .Values.tedBackfill.ranges }}
{{- $ranges = append $ranges (dict "from" .from "to" (.to | default .from) "rescore" (.rescore | default false)) }}
{{- end }}
{{- if and (not .Values.tedBackfill.ranges) .Values.tedBackfill.year }}
{{- $ym := printf "%d-%02d" (int .Values.tedBackfill.year) (int .Values.tedBackfill.month) }}
{{- $ranges = append $ranges (dict "from" $ym "to" $ym "rescore" .Values.tedBackfill.rescore) }}
{{- end }}
{{- range $r := $ranges }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ted-backfill-{{ $r.from }}-{{ $r.to }}
  labels:
    app: ted-backfill
    component: etl
spec:
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: {{ $.Values.tedBackfill.deadlineSeconds | default 172800 }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: ted-backfill
        component: etl
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ted-backfill
          image: contribute.void42.internal/fontem/fontem-api:{{ $.Values.version }}
          imagePullPolicy: Always
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
            - name: EVENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fontem-postgres-credentials
                  key: EVENTS_DATABASE_URL
            - name: CRONJOB_NAME
              value: "etl-ted-contracts-backfill-{{ $r.from }}-{{ $r.to }}"
            - name: IMAGE_TAG
              value: {{ $.Values.version | quote }}
          resources:
            requests:
              cpu: {{ $.Values.tedBackfill.cpuRequest | default "500m" | quote }}
              memory: {{ $.Values.tedBackfill.memRequest | default "2Gi" | quote }}
            limits:
              cpu: {{ $.Values.tedBackfill.cpuLimit | default "2" | quote }}
              memory: {{ $.Values.tedBackfill.memLimit | default "8Gi" | quote }}
          command:
            - python
            - -m
            - src.etl._run_wrapper
            - src.etl.load_ted_contracts
            - --from
            - {{ $r.from | quote }}
            - --to
            - {{ $r.to | quote }}
            {{- if $r.rescore }}
            - --rescore
            {{- end }}
{{- end }}
{{- end }}
