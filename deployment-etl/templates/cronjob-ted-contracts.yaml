{{/*
TED contract awards — the main procurement-data feed. Daily run picks
up the current month's archive (the loader is idempotent, so re-loads
of the same month MERGE on ted_notice_id without duplicating).
Year/month come from `date` at runtime so the cronjob always loads
the current calendar month.
*/}}
{{- include "edgar-gmr-etl.cronjob" (dict
      "name"            "etl-ted-contracts"
      "schedule"        "0 5 * * *"
      "module"          "src.etl.load_ted_contracts"
      "args"            (list "--year" "$(date +%Y)" "--month" "$(date +%m)")
      "deadlineSeconds" 7200
      "cpuRequest"      "500m"
      "cpuLimit"        "2"
      "memRequest"      "1Gi"
      "memLimit"        "4Gi"
      "extraEnv"        (list)
      "Values"          .Values
      "Release"         .Release) -}}
