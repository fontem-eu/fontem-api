{{/*
TED contract awards — the main procurement-data feed. Daily run picks 
up the current month's archive; the loader defaults --year + --month
to the current calendar month when neither flag is given (see the
comment in load_ted_contracts.main). The previous `--year $(date +%Y)`
shape required a /bin/sh wrapper around the container command, which
the shared `_etl_cronjob.tpl` does not provide — argparse received the
literal token `$(date +%Y)` and aborted every run with
`invalid int value`.
*/}}
{{- $extra := list }}
{{- with .Values.tedRaw }}
{{- if .enabled }}
{{- $extra = append $extra (dict "name" "TED_RAW_ENDPOINT" "value" .endpoint) }}
{{- $extra = append $extra (dict "name" "TED_RAW_BUCKET" "value" (.bucket | default "ted-raw")) }}
{{- $extra = append $extra (dict "name" "TED_RAW_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" .credentialsSecret "key" .accessKeyKey))) }}
{{- $extra = append $extra (dict "name" "TED_RAW_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" .credentialsSecret "key" .secretKeyKey))) }}
{{- end }}
{{- end }}
{{- include "edgar-gmr-etl.cronjob" (dict
      "name"            "etl-ted-contracts"
      "schedule"        "0 5 * * *"
      "module"          "src.etl.load_ted_contracts"
      "args"            (list)
      "deadlineSeconds" 7200
      "cpuRequest"      "500m"
      "cpuLimit"        "2"
      "memRequest"      "1Gi"
      "memLimit"        "4Gi"
      "extraEnv"        $extra
      "Values"          .Values
      "Release"         .Release) -}}
