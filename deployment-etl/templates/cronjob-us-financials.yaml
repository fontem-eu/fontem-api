{{- /*
US EDGAR financials → events.entity_events. Loader no longer
talks to Virtuoso directly — sinks own that projection.
*/ -}}
{{- include "edgar-gmr-etl.cronjob" (dict
      "name"            "etl-us-financials"
      "schedule"        "0 5 * * 0"
      "module"          "src.etl.load_us_financials"
      "args"            (list)
      "deadlineSeconds" 7200
      "cpuRequest"      "250m"
      "cpuLimit"        "1"
      "memRequest"      "1Gi"
      "memLimit"        "3Gi"
      "extraEnv"        (list)
      "needsEdgarData"  true
      "Values"          .Values
      "Release"         .Release) -}}
