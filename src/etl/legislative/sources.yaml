  LV: {name: Latvia,       gazette: Latvijas Vēstnesis / likumi.lv,      status: unsurveyed}
  LT: {name: Lithuania,    gazette: TAR (e-tar.lt),                      status: unsurveyed}
  LU: {name: Luxembourg,   gazette: Legilux,          base: https://legilux.public.lu,       # 200
