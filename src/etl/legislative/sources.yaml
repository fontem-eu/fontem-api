  DE: {name: Germany,      gazette: gesetze-im-internet.de,  base: https://www.gesetze-im-internet.de,  # 200
       eli_tier: none,     notes: no ELI; XML per law; bundestag/gesetze + kmein/gesetze git mirrors for provenance,
       status: unsurveyed}
  GR: {name: Greece,       gazette: ΦΕΚ / et.gr,                         status: unsurveyed}
  HU: {name: Hungary,      gazette: Magyar Közlöny / njt.hu,             status: unsurveyed}
  IE: {name: Ireland,      gazette: electronic Irish Statute Book (eISB), notes: ELI adopter, status: unsurveyed}
  IT: {name: Italy,        gazette: Normattiva,       base: https://www.normattiva.it,       # 200
