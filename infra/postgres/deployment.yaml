---
# PostgreSQL for gmr-community-api — persistent app state.
# NOT managed by ArgoCD. Apply manually: kubectl apply -f infra/postgres/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gmr-postgres-data
  namespace: gmr
  labels:
    app: postgresql
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: gmr
  labels:
    app: postgresql
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        kube-monkey/enabled: enabled
        kube-monkey/identifier: postgresql
        kube-monkey/mtbf: "3"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: gmr_app
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmr-postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gmr-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: gmr
  labels:
    app: postgresql
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
