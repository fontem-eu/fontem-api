---
# Neo4j data — NFS-backed with Retain policy.
# This PV/PVC pair is NEVER managed by ArgoCD or Helm.
# Apply manually: kubectl apply -f infra/neo4j/pvc.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-data-pv
  labels:
    app: neo4j
    managed-by: manual
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.44.0.6
    path: /srv/nfs/neo4j-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: gmr
  labels:
    app: neo4j
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: neo4j-data-pv
---
# Backup volume — separate NFS share
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-backup-pv
  labels:
    app: neo4j
    managed-by: manual
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.44.0.6
    path: /srv/nfs/neo4j-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-backup
  namespace: gmr
  labels:
    app: neo4j
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  volumeName: neo4j-backup-pv
