apiVersion: batch/v1
kind: CronJob
metadata:
  name: ted-daily
  namespace: gmr
spec:
  schedule: "0 6 * * 1-5"   # Weekdays at 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600   # 1-hour timeout
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ted-loader
              image: contribute.void42.internal/golden/gmr-api:latest
              command:
                - python3
                - -m
                - src.etl.load_ted_contracts
                - --daily
              env:
                - name: NEO4J_URI
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_URI
                - name: NEO4J_USER
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_USER
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_PASSWORD
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
