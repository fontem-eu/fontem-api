apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: gmr
  labels:
    app: neo4j
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  replicas: 1
  strategy:
    type: Recreate   # single-node DB — stop old pod before starting new one
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false   # prevent k8s service env vars conflicting with Neo4j config
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: browser
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_AUTH
            - name: NEO4J_dbms_connector_bolt_listen__address
              value: "0.0.0.0:7687"
            - name: NEO4J_dbms_connector_http_listen__address
              value: "0.0.0.0:7474"
            - name: NEO4J_server_memory_heap_initial__size
              value: "4g"
            - name: NEO4J_server_memory_heap_max__size
              value: "6g"
            - name: NEO4J_server_memory_pagecache_size
              value: "3g"
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "12Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backup
              mountPath: /backup
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-data
        - name: backup
          persistentVolumeClaim:
            claimName: neo4j-backup
