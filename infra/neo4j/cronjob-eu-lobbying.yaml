apiVersion: batch/v1
kind: CronJob
metadata:
  name: eu-lobbying-refresh
  namespace: gmr
spec:
  schedule: "0 5 1 * *"    # Monthly, 1st at 05:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: eu-lobbying-refresh
        spec:
          restartPolicy: OnFailure
          containers:
            - name: loader
              image: contribute.void42.internal/golden/gmr-api:latest
              command:
                - /bin/sh
                - -c
                - |
                  python3 -m src.etl.load_eu_lobbying
                  curl -fsS "${KUMA_PUSH_URL}" > /dev/null || true
              env:
                - name: KUMA_PUSH_URL
                  value: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/api/push/f6df3bb6-224d-b154-b34e-cac4c8e9d8b5?status=up&msg=lobbying-ok"
                - name: NEO4J_URI
                  value: "bolt://neo4j:7687"
                - name: NEO4J_USER
                  value: "neo4j"
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
          imagePullSecrets:
            - name: regcred
