apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: gmr
type: Opaque
stringData:
  # Used by the Neo4j container to initialise auth
  NEO4J_AUTH: "neo4j/gmr-neo4j-2026"
  # Used by gmr-api (and ETL jobs) to connect
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "gmr-neo4j-2026"
