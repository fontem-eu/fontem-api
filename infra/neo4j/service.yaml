apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: gmr
  labels:
    app: neo4j
    managed-by: manual
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  selector:
    app: neo4j
  ports:
    - name: browser
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
