apiVersion: batch/v1
kind: CronJob
metadata:
  name: neo4j-backup
  namespace: gmr
spec:
  schedule: "0 1 * * *"   # Daily at 01:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: neo4j:5-community
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y%m%d-%H%M)
                  echo "Starting Neo4j backup ${DATE}..."

                  # Use cypher-shell to export via APOC (works on community edition)
                  cypher-shell -a bolt://neo4j.gmr.svc.cluster.local:7687 \
                    -u neo4j -p "$NEO4J_PASSWORD" \
                    "CALL apoc.export.cypher.all(null, {streamStatements:true, format:'cypher-shell'})" \
                    > /backup/${DATE}-full.cypher

                  # Compress
                  gzip /backup/${DATE}-full.cypher
                  SIZE=$(du -sh /backup/${DATE}-full.cypher.gz | cut -f1)
                  echo "Backup saved: ${DATE}-full.cypher.gz (${SIZE})"

                  # Keep only last 7 days
                  ls -t /backup/*.cypher.gz 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null || true
                  echo "Backup complete. Files:"
                  ls -lh /backup/*.cypher.gz 2>/dev/null

                  # Notify Uptime Kuma of successful backup
                  curl -fsS "${KUMA_PUSH_URL}" > /dev/null || true
              env:
                - name: KUMA_PUSH_URL
                  value: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/api/push/339758c6-c65e-ae70-0136-a01ca91ed64e?status=up&msg=backup-ok"
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: neo4j-backup
