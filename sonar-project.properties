sonar.projectKey=edgar-gmr-etl
sonar.projectName=edgar-gmr-etl
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.python.coverage.reportPaths=coverage.xml

# Files excluded from analysis entirely. ETL scripts, migrations, deployment
# manifests, and thin data-source adapters are exercised by integration runs,
# not unit tests, and they host the bulk of inherent complexity (long sequential
# pipelines) that doesn't decompose cleanly.
sonar.exclusions=\
  src/etl/**,\
  src/api/run.py,\
  src/logging_config.py,\
  src/data/graph/graph_data_quality.py,\
  src/data/graph/graph_contract_source.py,\
  src/analysis/contract_data_source.py,\
  src/analysis/entity_resolver.py,\
  src/data_quality/assertions/consistency.py,\
  src/analysis/fundamentals.py,\
  src/analysis/valuation.py,\
  src/analysis/gmr_short.py,\
  src/data/north_america/**,\
  migrations/**,\
  deployment/**

# Coverage exclusions: routers, schemas, LLM proxies — integration-tested only.
sonar.coverage.exclusions=\
  src/api/routers/**,\
  src/api/schemas/**,\
  src/api/app.py,\
  src/api/dependencies.py,\
  src/services/llm_service.py,\
  src/data/**

# pylint runs as part of the gate already — don't double-count its findings in Sonar.
# Also skip Sonar's cognitive-complexity rule on routers (FastAPI branching is
# inherently wide) and the dual list/Optional type hints Pydantic schemas use.
sonar.issue.ignore.multicriteria=pylintall,complexrouters,complexllm,optlist
sonar.issue.ignore.multicriteria.pylintall.ruleKey=external_pylint:*
sonar.issue.ignore.multicriteria.pylintall.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.complexrouters.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexrouters.resourceKey=src/api/routers/**/*.py
sonar.issue.ignore.multicriteria.complexllm.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexllm.resourceKey=src/services/llm_service.py
sonar.issue.ignore.multicriteria.optlist.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.optlist.resourceKey=src/api/schemas/**/*.py
