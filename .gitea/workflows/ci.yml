name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir vendor/*.whl
          pip install --no-cache-dir -r requirements.txt pytest pylint tzdata
      - name: Test
        run: python3 -m pytest tests/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.gmr-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.gmr-ci/actions/secret-scan

  # Build → sign → attest SBOM → deploy. SBOM generation happens
  # inline here so the same file is both uploaded to DT and used
  # as the attestation predicate (replaces the separate `analyze`
  # job that only produced the SBOM).
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - name: Setup Docker + Cosign
        run: |
          curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.gmr-ci/actions/sbom-generate
        with:
          language: python
          project-name: edgar-gmr-etl
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.gmr-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/golden/gmr-api
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      - name: Deploy to staging
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          git clone --depth=1 https://oauth2:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/golden/gitops.git /tmp/gitops
          cd /tmp/gitops
          sed -i "s/version: \".*\"/version: \"$TAG\"/" staging/gmr-api.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add staging/gmr-api.yaml
          git diff --cached --quiet || git commit -m "ci: deploy gmr-api $TAG to staging"
          git push origin main
