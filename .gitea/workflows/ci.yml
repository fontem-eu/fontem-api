name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            gcc g++ libpq-dev git \
          && rm -rf /var/lib/apt/lists/*
      - name: Install app deps
        run: pip install --no-cache-dir -r requirements.txt pytest pylint
      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -q
      - name: Run pylint
        run: |
          python3 -m pylint src tests \
            --output-format=parseable --reports=no \
            > pylint-report.txt 2>&1 || true
          tail -1 pylint-report.txt
