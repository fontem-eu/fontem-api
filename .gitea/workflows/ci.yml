name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: apt-get update && apt-get install -y gcc g++ libpq-dev python3-pip
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: pip install --break-system-packages -r requirements.txt
      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -q
      - name: Run pylint
        run: |
          python3 -m pylint src tests \
            --output-format=parseable --reports=no \
            > pylint-report.txt 2>&1 || true
          tail -1 pylint-report.txt
