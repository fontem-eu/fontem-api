name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir vendor/*.whl
          pip install --no-cache-dir -r requirements.txt pytest pylint tzdata
      - name: Test
        run: python3 -m pytest tests/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  # Helm chart sanity gate — runs on every push, doesn't need cluster
  # access. Catches the class of mistake that only surfaces on Argo
  # sync today: image references that don't match the cluster's Kyverno
  # restrict-image-registries allowlist (e.g. `timescale/foo:bar`
  # without the `docker.io/` prefix), broken templates, and references
  # to non-existent image tags. Cheap — `helm template` is local-only.
  chart:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Render fontem-stats chart with prod values
        # Helm via the official docker image — the runner has docker but
        # `get.helm.sh` egress is firewalled. The image pull runs via the
        # cluster Nexus docker.io proxy, no extra creds needed.
        run: |
          # Provide a stand-in cronjobs.imageTag so `required` clears.
          # Renders against the chart's own defaults plus the prod
          # values (which is what Argo merges in production).
          docker run --rm \
            -v "$(pwd):/wd" -w /wd \
            alpine/helm:3.16.3 template fontem-stats deployment-stats \
              --values deployment-stats/values.yaml \
              --set cronjobs.imageTag=ci-render-test \
            > /tmp/rendered.yaml
          echo "rendered $(wc -l < /tmp/rendered.yaml) lines"
      - name: Image-registry allowlist gate
        # Mirrors the cluster's Kyverno restrict-image-registries policy.
        # Every `image:` referenced in the rendered chart must match one
        # of the allowed prefixes. Fail-fast at PR time instead of
        # discovering on Argo sync.
        run: |
          python3 - <<'PY'
          import re, sys, fnmatch
          ALLOWLIST = [
              "contribute.void42.internal/*",
              "neo4j:*", "postgres:*", "minio/*", "nginx:*",
              "ghcr.io/*", "docker.io/*", "cr.l5d.io/*",
          ]
          bad = []
          with open("/tmp/rendered.yaml") as f:
              for line in f:
                  m = re.match(r'^\s*image:\s*"?([^"\s]+)"?', line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if any(fnmatch.fnmatchcase(ref, p) for p in ALLOWLIST):
                      print(f"OK   {ref}")
                  else:
                      print(f"FAIL {ref}")
                      bad.append(ref)
          if bad:
              print()
              print(f"::error::{len(bad)} image reference(s) not in cluster Kyverno allowlist:")
              for b in bad: print(f"  - {b}")
              print(f"Allowlist: {ALLOWLIST}")
              sys.exit(1)
          PY

  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.gmr-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.gmr-ci/actions/secret-scan

  # Build → sign → attest SBOM → deploy. SBOM generation happens
  # inline here so the same file is both uploaded to DT and used
  # as the attestation predicate (replaces the separate `analyze`
  # job that only produced the SBOM).
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    # ci-python runner bundles python3 + pip + node + docker CLI. ubuntu-latest
    # resolves to ci-node which has no pip, so `sbom-generate language: python`
    # died with `pip: command not found` on every main build. Cosign still
    # has to be installed below — neither image ships it.
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.gmr-ci/actions/sbom-generate
        with:
          language: python
          project-name: edgar-gmr-etl
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.gmr-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/golden/gmr-api
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      - uses: ./.gmr-ci/actions/gitops-bump
        with:
          service: gmr-api
          tag: ${{ steps.image.outputs.tag }}
          env: staging
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
