name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
          GMR_CI_READ_TOKEN: ${{ secrets.GMR_CI_READ_TOKEN }}
        run: |
          pip install --no-cache-dir vendor/*.whl
          pip install --no-cache-dir -r requirements.txt pytest pylint tzdata
          # Internal-only deps: gmr-event-schemas + gmr-events live
          # in golden/* on Gitea. pip's isolated-build env can't
          # reach the registry from a plain git+http URL, so we
          # clone and install explicitly with the read token.
          tmpdir=$(mktemp -d)
          git clone --depth 1 \
              "http://lucid:${GMR_CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              "$tmpdir/gmr-event-schemas"
          git clone --depth 1 \
              "http://lucid:${GMR_CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              "$tmpdir/gmr-events"
          pip install --no-cache-dir "$tmpdir/gmr-event-schemas" "$tmpdir/gmr-events"
      - name: Test
        run: python3 -m pytest tests/ -q
      - name: Lint
        # Pylint is a hard gate now that the tree is rated 10.00/10 (see
        # the chore/lint-clean cleanup). Regressions fail CI loudly rather
        # than being hidden behind `|| true`.
        run: python3 -m pylint src tests --output-format=parseable --reports=no

  # Helm chart sanity gate — runs on every push, doesn't need cluster
  # access. Catches the class of mistake that only surfaces on Argo
  # sync today: image references that don't match the cluster's Kyverno
  # restrict-image-registries allowlist (e.g. `timescale/foo:bar`
  # without the `docker.io/` prefix), broken templates, and references
  # to non-existent image tags. Cheap — `helm template` is local-only.
  chart:
    runs-on: python
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Image-registry allowlist gate
        # Mirrors the cluster's Kyverno restrict-image-registries policy.
        # Walks every templates/*.yaml in deployment-stats/, extracts the
        # `image:` lines (which use `{{ .Values.foo }}` references), and
        # resolves them against deployment-stats/values.yaml plus each
        # gitops/<env>/fontem-stats.yaml override. Each resolved image
        # ref must match one of the cluster's allowed registry prefixes.
        # Fails the PR if not — same outcome Argo would produce on sync,
        # discovered ~5 minutes earlier.
        #
        # No helm dependency: the cluster CI runner is firewalled from
        # get.helm.sh, and the local docker image bind-mount path
        # doesn't survive the runner's DinD layer.
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import fnmatch, glob, os, re, sys, yaml

          ALLOWLIST = [
              "contribute.void42.internal/*",
              "neo4j:*", "postgres:*", "minio/*", "nginx:*",
              "ghcr.io/*", "docker.io/*", "cr.l5d.io/*",
          ]

          # Default values + every per-env override that ArgoCD will
          # merge on top. We validate the union — any image ref any
          # env actually deploys with must be allowlisted.
          values_files = [
              "deployment-stats/values.yaml",
              # Per-env overrides live in the gitops repo, not here;
              # we substitute the prod cronjobs.imageTag inline below.
          ]
          values: dict = {}
          def _merge(dst, src):
              for k, v in (src or {}).items():
                  if isinstance(v, dict) and isinstance(dst.get(k), dict):
                      _merge(dst[k], v)
                  else:
                      dst[k] = v
          for vf in values_files:
              with open(vf) as f:
                  _merge(values, yaml.safe_load(f) or {})
          # Stand-in for the gitops-side cronjobs.imageTag bump (which
          # is `required` by the chart). Mirror what ArgoCD produces.
          values.setdefault("cronjobs", {})["imageTag"] = (
              values["cronjobs"].get("imageTag") or "ci-render-test"
          )

          def resolve_ref(ref: str) -> str | None:
              # `{{ .Values.foo.bar }}:{{ .Values.foo.tag | required ... }}`
              # — strip the |...filter then resolve dotted keys.
              def _expand(m):
                  expr = m.group(1).strip()
                  # Drop any `| pipe ...` filters.
                  expr = expr.split("|")[0].strip()
                  if not expr.startswith(".Values."):
                      return m.group(0)
                  parts = expr[len(".Values."):].split(".")
                  cur = values
                  for p in parts:
                      if not isinstance(cur, dict) or p not in cur:
                          return f"<UNRESOLVED:{expr}>"
                      cur = cur[p]
                  return str(cur)
              out = re.sub(r"\{\{\s*(.*?)\s*\}\}", _expand, ref)
              if "<UNRESOLVED" in out:
                  return None
              return out

          # Capture the full rest of the line (Go templates can carry
          # nested `"` from filters like `required "msg"`, so we can't
          # just stop at the first quote). Trim leading/trailing whitespace
          # and a single optional surrounding quote pair afterwards.
          refs: list[tuple[str, str]] = []
          for tpl in sorted(glob.glob("deployment-stats/templates/*.yaml")):
              with open(tpl) as f:
                  for line in f:
                      m = re.match(r"^\s*image:\s*(.*?)\s*$", line)
                      if not m:
                          continue
                      raw = m.group(1)
                      if raw.startswith('"') and raw.endswith('"'):
                          raw = raw[1:-1]
                      refs.append((tpl, raw))

          bad = []
          for tpl, raw in refs:
              resolved = resolve_ref(raw)
              if resolved is None:
                  print(f"SKIP  {tpl}: {raw}  (unresolved values reference)")
                  continue
              ok = any(fnmatch.fnmatchcase(resolved, p) for p in ALLOWLIST)
              tag = "OK  " if ok else "FAIL"
              print(f"{tag}  {tpl}: {resolved}")
              if not ok:
                  bad.append((tpl, resolved))

          if bad:
              print()
              print(f"::error::{len(bad)} image ref(s) not in cluster Kyverno allowlist:")
              for tpl, ref in bad:
                  print(f"  - {ref}  (in {tpl})")
              print(f"Allowlist: {ALLOWLIST}")
              sys.exit(1)
          print()
          print(f"all {len(refs)} image refs match the cluster allowlist")
          PY

      - name: Env-var ordering gate
        # Walks every helm template + every flat manifest under
        # deployment*/ and infra/, finds each `env:` list, and verifies
        # any `value:` containing `$(VAR)` references a `name:` declared
        # earlier in the SAME list. K8s evaluates substitutions in
        # declaration order, so a wrongly-ordered list silently lands a
        # literal `$(VAR)` and 28P01s only at runtime.
        # Caught the cronjob-sync-{daily,weekly} bug retroactively.
        run: |
          python3 - <<'PY'
          import glob, re, sys, yaml

          # Helm templates intermixed with raw YAML — strip the `{{ }}`
          # blocks so safe_load can parse them, then walk the remains.
          GO_TPL = re.compile(r"\{\{[^}]*\}\}")
          REF = re.compile(r"\$\(([A-Z_][A-Z0-9_]*)\)")

          def envs_from_pod_spec(spec):
              for sec in ("initContainers", "containers"):
                  for c in (spec or {}).get(sec, []) or []:
                      yield c.get("name","?"), c.get("env") or []

          def all_env_lists(doc):
              if not isinstance(doc, dict):
                  return
              kind = doc.get("kind","")
              tpl = (doc.get("spec") or {}).get("template") or {}
              if "spec" in tpl:
                  yield from envs_from_pod_spec(tpl["spec"])
              # CronJob → spec.jobTemplate.spec.template.spec
              jt = ((doc.get("spec") or {}).get("jobTemplate") or {}).get("spec") or {}
              if "template" in jt and "spec" in (jt["template"] or {}):
                  yield from envs_from_pod_spec(jt["template"]["spec"])
              # Plain Pod
              if kind == "Pod":
                  yield from envs_from_pod_spec(doc.get("spec") or {})

          paths = sorted(set(
              glob.glob("deployment*/templates/*.yaml") +
              glob.glob("deployment*/templates/**/*.yaml", recursive=True)
          ))
          if not paths:
              print("(no chart templates found)")
              sys.exit(0)

          bad = []
          for path in paths:
              with open(path) as f:
                  raw = f.read()
              # Strip Go templates so safe_load can parse YAML structure.
              # We only need env-list shape, not the values.
              cleaned = GO_TPL.sub("__TEMPLATED__", raw)
              try:
                  docs = list(yaml.safe_load_all(cleaned))
              except yaml.YAMLError as e:
                  # If a template is too dynamic to parse, skip — we
                  # don't fail PRs on parser quirks.
                  print(f"SKIP  {path}: yaml parse failed ({e.__class__.__name__})")
                  continue
              for doc in docs:
                  for cname, env in all_env_lists(doc):
                      seen = set()
                      for entry in env:
                          name = (entry or {}).get("name")
                          val = (entry or {}).get("value")
                          if val and isinstance(val, str):
                              for ref in REF.findall(val):
                                  if ref not in seen:
                                      bad.append((path, cname, name, ref, list(seen)))
                          if name:
                              seen.add(name)

          if bad:
              print()
              print(f"::error::{len(bad)} env-var ordering issue(s):")
              for path, cname, var, ref, seen in bad:
                  print(f"  {path}: container {cname!r}: {var!r}'s value references "
                        f"$({ref}) but {ref} is declared after it (or not at all). "
                        f"Already-declared at this point: {seen}")
              print()
              print("Fix: reorder the env list so the `name: <X>` entry comes "
                    "BEFORE any `value:` that contains $(<X>).")
              sys.exit(1)
          print(f"checked {len(paths)} template files: env-var ordering OK")
          PY

  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.fontem-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.fontem-ci/actions/secret-scan

  # Build → sign → attest SBOM → deploy. SBOM generation happens
  # inline here so the same file is both uploaded to DT and used
  # as the attestation predicate (replaces the separate `analyze`
  # job that only produced the SBOM).
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    # ci-python runner bundles python3 + pip + node + docker CLI. ubuntu-latest
    # resolves to ci-node which has no pip, so `sbom-generate language: python`
    # died with `pip: command not found` on every main build. Cosign still
    # has to be installed below — neither image ships it.
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.fontem-ci/actions/sbom-generate
        with:
          language: python
          project-name: edgar-gmr-etl
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - name: Vendor internal Python deps for docker build
        # The Dockerfile pip-installs from vendor/gmr-event-schemas
        # and vendor/gmr-events. pip's isolated-build env can't
        # reach the internal Gitea, so we clone here at CI time
        # using GMR_CI_READ_TOKEN, then docker build copies them in.
        env:
          GMR_CI_READ_TOKEN: ${{ secrets.GMR_CI_READ_TOKEN }}
        run: |
          mkdir -p vendor
          for repo in gmr-event-schemas gmr-events; do
              rm -rf "vendor/$repo"
              git clone --depth 1 \
                  "http://lucid:${GMR_CI_READ_TOKEN}@contribute.void42.internal/fontem/${repo}.git" \
                  "vendor/$repo"
              rm -rf "vendor/$repo/.git"
          done

      - id: image
        name: Build, push, sign, attest
        uses: ./.fontem-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-api
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      # Inline gitops-bump. The shared action in void42/ci-actions
      # was rewritten for the void42-templates layout
      # (environments/<env>/image-tag.yaml) that doesn't match
      # fontem/gitops's testing/<svc>.yaml layout. Same shape as
      # the consolidator + sinks workflows.
      - name: Bump image tag in gitops/testing
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'"$TAG"'"/' testing/fontem-api.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add testing/fontem-api.yaml
          if git diff --cached --quiet; then
            echo "No version change; skipping commit"
            exit 0
          fi
          git commit -m "ci: deploy fontem-api $TAG to testing"
          git push origin main
