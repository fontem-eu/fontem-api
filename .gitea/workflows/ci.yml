name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - name: Debug env
        run: echo "REPO=$GITHUB_REPOSITORY REF=$GITHUB_REF_NAME HEAD=$GITHUB_HEAD_REF SHA=$GITHUB_SHA SERVER=$GITHUB_SERVER_URL"
      - name: Test clone
        run: git clone --depth=1 http://gitea-http.dev-tools.svc.cluster.local:3000/golden/edgar-gmr-etl.git /tmp/test && ls /tmp/test
