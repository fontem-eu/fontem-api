name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check environment
        run: |
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"
          echo "pip: $(pip3 --version 2>&1 || echo 'no pip')"
          echo "Working dir: $(pwd)"
          ls -la
