name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pip install --no-cache-dir vendor/*.whl
          pip install --no-cache-dir -r requirements.txt pytest pylint tzdata
      - name: Test
        run: python3 -m pytest tests/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Build and push image
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build -t gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-api:$TAG .
          docker push gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-api:$TAG
      - name: Sign image with Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          curl -sL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-api:$TAG
          rm /tmp/cosign.key
      - name: Deploy to staging
        run: |
          git clone --depth=1 http://oauth2:${{ secrets.REGISTRY_PASSWORD }}@gitea-http.dev-tools.svc.cluster.local:3000/golden/gitops.git /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'$TAG'"/' staging/gmr-api.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add staging/gmr-api.yaml
          git diff --cached --quiet || git commit -m "ci: deploy gmr-api $TAG to staging"
          git push origin main
