name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            gcc g++ libpq-dev git \
          && rm -rf /var/lib/apt/lists/*
      - name: Checkout
        run: |
          git clone --depth=1 --branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            "http://gitea-http.dev-tools.svc.cluster.local:3000/${GITHUB_REPOSITORY}.git" .
      - name: Install app deps
        run: pip install --no-cache-dir -r requirements.txt pytest pylint
      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -q
      - name: Run pylint
        run: |
          python3 -m pylint src tests \
            --output-format=parseable --reports=no \
            > pylint-report.txt 2>&1 || true
          tail -1 pylint-report.txt
