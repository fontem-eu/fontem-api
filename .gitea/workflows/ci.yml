name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - name: Checkout
        run: git clone --depth=1 http://gitea-http.dev-tools.svc.cluster.local:3000/$GITHUB_REPOSITORY.git .
      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt pytest pylint 2>&1 | tail -5
      - name: Test
        run: python3 -m pytest tests/unit/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true
