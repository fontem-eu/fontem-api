version: "v41f487e"
domain: localhost
apiIngress: "true"
replicas: 1

# Connection details for the fontem-stats Postgres deployment, used by
# the /api/atlas/* router family. Disabled by default so dev/dast — and
# any environment that doesn't have the stats stack provisioned — boots
# without referencing a secret that doesn't exist.
fontemStats:
  enabled: false
  host: fontem-stats-postgres
  user: fontem_stats
  database: fontem_stats
  secretName: fontem-stats-credentials

# Events Postgres (events.entity_events + events.etl_run) — read by
# /api/atlas/etl-runs so the data-quality dashboard can read the per-
# cronjob "last successful run" timestamp without scraping pod logs.
# Disabled by default so envs that don't share the events DB still boot.
# Non-prod consumes the shared events postgres at fontem-shared via
# cross-ns secret; prod has its own.
eventsDb:
  enabled: false
  secretName: fontem-postgres-credentials

# Virtuoso SPARQL endpoint surfaced to the API for read-only sanctions
# panels. Disabled by default — non-prod consumes the shared Virtuoso
# at fontem-shared via cluster DNS, prod its own.
virtuoso:
  enabled: false
  sparqlEndpoint: ""
  dbaPasswordSecret: virtuoso-credentials
  dbaPasswordKey: VIRTUOSO_DBA_PASSWORD

# Service type. Default NodePort keeps backward compat with non-prod
# envs; real prod overrides to ClusterIP since fontem-web reverse-proxies
# /api/ over cluster DNS.
service:
  type: NodePort
