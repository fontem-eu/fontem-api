version: "v41f487e"
domain: localhost
apiIngress: "true"
replicas: 1

# Connection details for the fontem-stats Postgres deployment, used by
# the /api/atlas/* router family. Disabled by default so dev/dast — and
# any environment that doesn't have the stats stack provisioned — boots
# without referencing a secret that doesn't exist.
fontemStats:
  enabled: false
  host: fontem-stats-postgres
  user: fontem_stats
  database: fontem_stats
  secretName: fontem-stats-credentials

# Virtuoso target for the sanctions ETL's RDF dual-write. When
# enabled, the sanctions cronjob picks up VIRTUOSO_SPARQL_ENDPOINT
# + VIRTUOSO_DBA_PASSWORD from the secret below and pushes Turtle
# to its default graph (http://data.fontem.eu/graph/sanctions) in
# addition to the legacy Neo4j writes. Disabled by default — only
# prod opts in until non-prod envs get their own Virtuoso or are
# retired alongside the cutover.
virtuoso:
  enabled: false
  sparqlEndpoint: ""
  dbaPasswordSecret: virtuoso-credentials
  dbaPasswordKey: VIRTUOSO_DBA_PASSWORD

# Service type. Default NodePort keeps backward compat with non-prod
# envs; real prod (fontem-prod) overrides this to ClusterIP in
# gitops/prod/gmr-api.yaml since gmr-web reverse-proxies /api/ over
# cluster DNS, and a per-node 31xxx port serves no purpose there.
service:
  type: NodePort
