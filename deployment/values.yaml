version: "v41f487e"
domain: localhost
apiIngress: "true"
replicas: 1

# Connection details for the fontem-stats Postgres deployment, used by
# the /api/atlas/* router family. Disabled by default so dev/dast — and
# any environment that doesn't have the stats stack provisioned — boots
# without referencing a secret that doesn't exist.
fontemStats:
  enabled: false
  host: fontem-stats-postgres
  user: fontem_stats
  database: fontem_stats
  secretName: fontem-stats-credentials

# Wikidata mirror infrastructure — relay (SSE consumer that fills
# wikidata.dirty_entities) + consumer (drains the set into Virtuoso).
# The mirror lives in fontem-prod and runs there by default; non-prod
# environments don't have the wikidata graph in their Virtuoso (or use
# the shared one cross-namespace), and there's no point in spending
# Wikimedia rate-limit budget on duplicate drains. Non-prod gitops
# values files override this to `enabled: false`.
wikidata:
  enabled: true

# Virtuoso SPARQL endpoint surfaced to the API for read-only sanctions
# panels. Disabled by default — non-prod consumes the shared Virtuoso
# at fontem-shared via cluster DNS, prod its own.
virtuoso:
  enabled: false
  sparqlEndpoint: ""
  dbaPasswordSecret: virtuoso-credentials
  dbaPasswordKey: VIRTUOSO_DBA_PASSWORD

# Keyword extraction for legislative title search (stop-word removal).
# The singleton fontem-linguistics deployment serves every env over
# cluster DNS; disabled by default for envs without the service.
linguistics:
  enabled: false
  url: "http://fontem-linguistics.linguistics-service.svc.cluster.local:8080"

# Service type. Default NodePort keeps backward compat with non-prod
# envs; real prod overrides to ClusterIP since fontem-web reverse-proxies
# /api/ over cluster DNS.
service:
  type: NodePort

# Events store (read-only) for the ETL-runs + pipeline-health DQ
# endpoints. Same Postgres the ETL cronjobs write to.
eventsStore:
  secretName: fontem-postgres-credentials
  secretKey: EVENTS_DATABASE_URL
