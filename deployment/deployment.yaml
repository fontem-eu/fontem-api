apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gmr
  name: gmr-api
  labels:
    app: gmr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmr-api
  template:
    metadata:
      labels:
        app: gmr-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gmr-api
          image: contribute.void42.internal/golden/gmr-api:e6e822c
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          # SEC EDGAR rate-limits by IP/user-agent; give the pod enough time
          # to receive a response before liveness kicks in.
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            # Override to send your own identity to the SEC EDGAR API.
            - name: EDGAR_IDENTITY
              value: "bemar-edgar@research.com"
