apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fontem-api
  labels:
    app: fontem-api
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-api
  template:
    metadata:
      labels:
        app: fontem-api
        kube-monkey/enabled: enabled
        kube-monkey/identifier: fontem-api
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        # Download DB-IP Country Lite (free, CC BY 4.0, no API key)
        # into a shared emptyDir. Powers `IpToCountryService` ↦ the
        # /euro-tracker/me/country endpoint. Best-effort: if the
        # download fails the main container still starts; the API
        # just falls back to "country: null" and the frontend asks
        # for a country pick.
        - name: geoip-download
          image: docker.io/curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Try the current month's DB; fall back to the previous
              # one if it isn't published yet (DB-IP releases mid-month).
              for offset in 0 1 2; do
                ym=$(date -u -d "${offset} months ago" +%Y-%m 2>/dev/null \
                  || date -u +%Y-%m)
                url="https://download.db-ip.com/free/dbip-country-lite-${ym}.mmdb.gz"
                echo "[geoip] trying $url"
                if curl -fsS --max-time 30 -o /tmp/db.mmdb.gz "$url"; then
                  gunzip -c /tmp/db.mmdb.gz > /geoip/dbip-country-lite.mmdb
                  echo "[geoip] installed $(stat -c %s /geoip/dbip-country-lite.mmdb) bytes from $ym"
                  exit 0
                fi
              done
              echo "[geoip] WARNING: download failed; main container will fall back to country=null"
              # Exit 0 so the main container still boots — feature
              # degrades gracefully when the DB is missing.
              exit 0
          volumeMounts:
            - name: geoip
              mountPath: /geoip
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
      containers:
        - name: fontem-api
          image: contribute.void42.internal/fontem/fontem-api:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "8Gi"
          env:
            # SEC EDGAR's Fair Access policy requires a deliverable
            # contact in the User-Agent. edgartools picks this value up
            # automatically when building requests.
            - name: EDGAR_IDENTITY
              value: "Fontem team@fontem.eu"

            # Local EDGAR bulk data (written by edgar-data-fetcher CronJob).
            - name: GMR_EDGAR_LOCAL_DATA_DIR
              value: "/edgar-data/full"

            # Local price data (written by usa-stock-price-fetcher CronJob).
            - name: GMR_PRICE_DATA_DIR
              value: "/edgar-data/prices"

            # ESEF European financial summaries (written by esef-data-fetcher).
            - name: GMR_ESEF_DATA_DIR
              value: "/esef-data/esef"

            # Neo4j graph database connection.
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD

            # Fontem stats Postgres (TimescaleDB+PostGIS) — read by the
            # /api/atlas/* surface (src/atlas_api/). Optional: when the
            # secret is absent (dev/dast or before the stats stack is
            # provisioned), the env var stays empty and Atlas reports
            # `unconfigured` on /atlas/health while returning 503 on
            # data routes — graceful degrade.
            {{- if .Values.fontemStats.enabled }}
            # STATS_POSTGRES_PASSWORD must come BEFORE STATS_DATABASE_URL
            # — Kubernetes evaluates `$(VAR)` substitutions in declaration
            # order, so the URL referencing the password only expands if
            # the password env is defined first. Swapping the order
            # silently lands a literal `$(STATS_POSTGRES_PASSWORD)` in the
            # connection string, which then 28000-FATALs on every connect.
            - name: STATS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fontemStats.secretName | default "fontem-stats-credentials" }}
                  key: POSTGRES_PASSWORD
            - name: STATS_DATABASE_URL
              value: "postgresql://{{ .Values.fontemStats.user }}:$(STATS_POSTGRES_PASSWORD)@{{ .Values.fontemStats.host }}:5432/{{ .Values.fontemStats.database }}"
            {{- end }}
            # Events store — read-only, powers the ETL-runs + per-source
            # pipeline-health DQ endpoints (EtlRunsSource). Independent of
            # fontemStats, so wired unconditionally from the same secret the
            # ETL cronjobs use. A direct secretKeyRef (no $(VAR) build), so
            # ordering is irrelevant; EtlRunsSource degrades to 503 if unset.
            - name: EVENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventsStore.secretName | default "fontem-postgres-credentials" }}
                  key: {{ .Values.eventsStore.secretKey | default "EVENTS_DATABASE_URL" }}
            {{- if .Values.virtuoso.enabled }}
            # Read-only SPARQL endpoint used by the data-quality
            # source for sanctions panels (post Phase 2 cutover).
            - name: VIRTUOSO_SPARQL_URL
              value: {{ .Values.virtuoso.sparqlEndpoint | quote }}
            {{- end }}

          volumeMounts:
            - name: edgar-data
              mountPath: /edgar-data
              readOnly: true
            - name: esef-data
              mountPath: /esef-data
              readOnly: true
            - name: geoip
              mountPath: /app/geoip
              readOnly: true

      volumes:
        - name: edgar-data
          persistentVolumeClaim:
            claimName: edgar-data
        - name: esef-data
          persistentVolumeClaim:
            claimName: esef-data
        - name: geoip
          emptyDir:
            sizeLimit: 32Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
