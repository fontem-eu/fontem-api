apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gmr
  name: gmr-api
  labels:
    app: gmr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmr-api
  template:
    metadata:
      labels:
        app: gmr-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gmr-api
          image: contribute.void42.internal/golden/gmr-api:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "8Gi"
          env:
            - name: EDGAR_IDENTITY
              value: "bemar-edgar@research.com"

            # Local EDGAR bulk data (written by edgar-data-fetcher CronJob).
            - name: GMR_EDGAR_LOCAL_DATA_DIR
              value: "/edgar-data/full"

            # Local price data (written by usa-stock-price-fetcher CronJob).
            - name: GMR_PRICE_DATA_DIR
              value: "/edgar-data/prices"

          volumeMounts:
            - name: edgar-data
              mountPath: /edgar-data
              readOnly: true

      volumes:
        - name: edgar-data
          persistentVolumeClaim:
            claimName: edgar-data
