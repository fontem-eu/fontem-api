apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gmr
  name: gmr-api
  labels:
    app: gmr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmr-api
  template:
    metadata:
      labels:
        app: gmr-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gmr-api
          image: contribute.void42.internal/golden/gmr-api:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "8Gi"
          env:
            - name: EDGAR_IDENTITY
              value: "bemar-edgar@research.com"

            # Local EDGAR bulk data (written by edgar-data-fetcher CronJob).
            - name: GMR_EDGAR_LOCAL_DATA_DIR
              value: "/edgar-data/full"

            # Local price data (written by usa-stock-price-fetcher CronJob).
            - name: GMR_PRICE_DATA_DIR
              value: "/edgar-data/prices"

            # ESEF European financial summaries (written by esef-data-fetcher).
            - name: GMR_ESEF_DATA_DIR
              value: "/esef-data/esef"

            # Neo4j graph database connection (graph-backed data source).
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD

          volumeMounts:
            - name: edgar-data
              mountPath: /edgar-data
              readOnly: true
            - name: esef-data
              mountPath: /esef-data
              readOnly: true

      volumes:
        - name: edgar-data
          persistentVolumeClaim:
            claimName: edgar-data
        - name: esef-data
          persistentVolumeClaim:
            claimName: esef-data
