apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gmr
  name: gmr-api
  labels:
    app: gmr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmr-api
  template:
    metadata:
      labels:
        app: gmr-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gmr-api
          image: contribute.void42.internal/golden/gmr-api:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          # SEC EDGAR rate-limits by IP/user-agent; give the pod enough time
          # to receive a response before liveness kicks in.
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "8Gi"
          env:
            # Override to send your own identity to the SEC EDGAR API.
            - name: EDGAR_IDENTITY
              value: "bemar-edgar@research.com"

            # Cache Configuration
            - name: CACHE_PROVIDER
              value: "redis"
            - name: REDIS_HOST
              value: "gmr-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"

            # Cache TTL Configuration (in seconds)
            - name: CACHE_TTL_FUNDAMENTALS
              value: "86400"  # 24 hours
            - name: CACHE_TTL_PRICES
              value: "3600"   # 1 hour
            - name: CACHE_TTL_MARKET_SNAPSHOT
              value: "300"    # 5 minutes

            # Cache Key Configuration
            - name: CACHE_KEY_PREFIX
              value: "gmretl:"
