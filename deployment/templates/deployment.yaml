apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: gmr-api
  labels:
    app: gmr-api
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gmr-api
  template:
    metadata:
      labels:
        app: gmr-api
        kube-monkey/enabled: enabled
        kube-monkey/identifier: gmr-api
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gmr-api
          image: contribute.void42.internal/golden/gmr-api:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "8Gi"
          env:
            - name: EDGAR_IDENTITY
              value: "bemar-edgar@research.com"

            # Local EDGAR bulk data (written by edgar-data-fetcher CronJob).
            - name: GMR_EDGAR_LOCAL_DATA_DIR
              value: "/edgar-data/full"

            # Local price data (written by usa-stock-price-fetcher CronJob).
            - name: GMR_PRICE_DATA_DIR
              value: "/edgar-data/prices"

            # ESEF European financial summaries (written by esef-data-fetcher).
            - name: GMR_ESEF_DATA_DIR
              value: "/esef-data/esef"

            # Neo4j graph database connection.
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD

            # Fontem stats Postgres (TimescaleDB+PostGIS) — read by the
            # /api/atlas/* surface (src/atlas_api/). Optional: when the
            # secret is absent (dev/dast or before the stats stack is
            # provisioned), the env var stays empty and Atlas reports
            # `unconfigured` on /atlas/health while returning 503 on
            # data routes — graceful degrade.
            {{- if .Values.fontemStats.enabled }}
            - name: STATS_DATABASE_URL
              value: "postgresql://{{ .Values.fontemStats.user }}:$(STATS_POSTGRES_PASSWORD)@{{ .Values.fontemStats.host }}:5432/{{ .Values.fontemStats.database }}"
            - name: STATS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fontemStats.secretName | default "fontem-stats-credentials" }}
                  key: POSTGRES_PASSWORD
            {{- end }}

          volumeMounts:
            - name: edgar-data
              mountPath: /edgar-data
              readOnly: true
            - name: esef-data
              mountPath: /esef-data
              readOnly: true

      volumes:
        - name: edgar-data
          persistentVolumeClaim:
            claimName: edgar-data
        - name: esef-data
          persistentVolumeClaim:
            claimName: esef-data
