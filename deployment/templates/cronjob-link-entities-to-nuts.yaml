apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-link-entities-to-nuts
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "30 2 1 * *"             # monthly 1st at 02:30 UTC (after NUTS load)
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: etl-link-entities-to-nuts
              image: contribute.void42.internal/golden/gmr-api:{{ .Values.version }}
              imagePullPolicy: Always
              env:
                - name: NEO4J_URI
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_URI
                - name: NEO4J_USER
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_USER
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: NEO4J_PASSWORD
              command:
                - python
                - -m
                - src.etl.link_entities_to_nuts
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
