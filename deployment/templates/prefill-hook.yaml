{{- if .Values.prefill }}
{{- if .Values.prefill.configMap }}
# Refresh the assistant's catalogue prefill after this API is deployed.
#
# PostSync, not PreSync: the block is generated by reading /catalogue from
# THIS service, so it has to run after the new version is actually serving.
# A PreSync hook would faithfully publish the previous release's catalogue.
#
# Per environment on purpose. The block describes whatever fontem-api is
# deployed, so testing's hook writes testing's block and production's writes
# production's. Sharing one would mean a testing deploy silently changing
# what production answers with — which is the coupling that made the shared
# agent a problem in the first place.
#
# The script fails closed: if the generated block is materially smaller than
# the published one it keeps the old one and exits non-zero, so the hook
# shows as failed rather than quietly shrinking every prompt on the platform.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-prefill-refresh
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        # The mesh sidecar never exits, so a Job with linkerd injected never
        # reaches Complete and Argo waits on the hook forever.
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: fontem-prefill-hook
      containers:
        - name: refresh
          image: python:3.12-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir --quiet httpx
              python /script/refresh_prefill.py \
                --api "http://{{ .Release.Name }}" \
                --namespace llm-service \
                --configmap {{ .Values.prefill.configMap }}
          volumeMounts:
            - { name: script, mountPath: /script }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: script
          configMap:
            name: {{ .Values.prefill.scriptConfigMap | default "llm-prefill-script" }}
            defaultMode: 0755

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fontem-prefill-hook
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- end }}
{{- end }}
