{{/*
Grafana dashboard for the Wikidata relay + consumer drain. Picked
up by the kube-prometheus-stack Grafana sidecar via the
`grafana_dashboard: "1"` label.

All time-series queries wrap their rate() in sum by (outcome) /
sum by (state) so that pod restarts (each restart creates a new
`instance` label and Prometheus retains the old series until the
retention window expires) don't multiply the lines on the chart.
The "total" lines are simple sum() with no `by`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fontem-wikidata-relay-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  wikidata-relay-drain.json: |
    {
      "title": "Wikidata Relay + Consumer Drain",
      "uid": "fontem-wikidata-drain",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "",
      "tags": ["fontem", "wikidata", "relay"],
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Arrival vs Drain (entities/sec)",
          "description": "Rate of work entering and leaving wikidata.dirty_entities. Arrival = relay-side counter (post-filter); drain = consumer-side counter (sum of successful outcomes). Each metric is sum across pod restarts.",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 9},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "custom": {"axisLabel": "entities / sec"}
            }
          },
          "targets": [
            {
              "expr": "sum(rate(wikidata_relay_events_total{outcome=\"dirty\"}[5m]))",
              "refId": "A",
              "legendFormat": "arrival (dirty)"
            },
            {
              "expr": "sum(rate(wikidata_relay_events_total{outcome=\"deleted\"}[5m]))",
              "refId": "B",
              "legendFormat": "arrival (deleted)"
            },
            {
              "expr": "sum(rate(wikidata_relay_events_total{outcome=~\"dirty|deleted\"}[5m]))",
              "refId": "C",
              "legendFormat": "arrival (total)"
            },
            {
              "expr": "sum(rate(wikidata_consumer_entities_total{outcome=~\"written|tombstoned|redirected\"}[5m]))",
              "refId": "D",
              "legendFormat": "drain (success)"
            },
            {
              "expr": "sum(rate(wikidata_consumer_entities_total{outcome=\"errors\"}[5m]))",
              "refId": "E",
              "legendFormat": "drain (errors)"
            },
            {
              "expr": "sum(rate(wikidata_consumer_entities_total[5m]))",
              "refId": "F",
              "legendFormat": "drain (total)"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Cursor lag (seconds behind real-time)",
          "description": "How many seconds the relay's resume cursor is behind Wikidata's wall-clock now(). Numbers near 0 = real-time. A persistent rise means the relay can't keep up or has stalled. A short spike during the daily Wikidata maintenance window is normal.",
          "gridPos": {"x": 0, "y": 9, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {"axisLabel": "seconds behind real-time", "lineWidth": 2, "fillOpacity": 10},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 300}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "max(wikidata_relay_cursor_lag_seconds)",
              "refId": "A",
              "legendFormat": "lag"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total in queue (right now)",
          "description": "Current row count in wikidata.dirty_entities, summed across refetch + tombstone.",
          "gridPos": {"x": 12, "y": 9, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            }
          },
          "targets": [
            {
              "expr": "sum(wikidata_dirty_entities_total)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Cursor lag (right now)",
          "description": "Snapshot of the lag at the moment of refresh. Below 60s = healthy, above 300s = the relay is falling behind.",
          "gridPos": {"x": 18, "y": 9, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 300}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "max(wikidata_relay_cursor_lag_seconds)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Dirty queue depth",
          "description": "Total rows in wikidata.dirty_entities by state. Aggregated across the relay's pod restarts so each state shows as one line. Hover anywhere on the chart to read the instant value.",
          "gridPos": {"x": 0, "y": 17, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "axisLabel": "entities in queue",
                "axisPlacement": "auto",
                "axisGridShow": true,
                "axisBorderShow": true,
                "showPoints": "auto",
                "lineWidth": 2,
                "fillOpacity": 8
              }
            }
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "desc"},
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"]}
          },
          "targets": [
            {
              "expr": "sum by (state) (wikidata_dirty_entities_total)",
              "refId": "A",
              "legendFormat": "{{`{{state}}`}}"
            },
            {
              "expr": "sum(wikidata_dirty_entities_total)",
              "refId": "B",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Net drain rate (drain success − arrival, entities/sec)",
          "description": "Positive = queue is shrinking, the consumer is outpacing relay arrivals. Negative = backlog is growing. Zero line = steady-state, drain matches arrival. Same 5-minute rate window as the other panels so the lines line up. Hover to read the instant value.",
          "gridPos": {"x": 12, "y": 17, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "custom": {
                "axisLabel": "net drain (entities / sec)",
                "axisPlacement": "auto",
                "axisGridShow": true,
                "axisBorderShow": true,
                "showPoints": "auto",
                "lineWidth": 2,
                "fillOpacity": 12,
                "gradientMode": "scheme",
                "thresholdsStyle": {"mode": "line"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 0}
                ]
              },
              "color": {"mode": "thresholds"}
            }
          },
          "options": {
            "tooltip": {"mode": "single"},
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "mean"]}
          },
          "targets": [
            {
              "expr": "sum(rate(wikidata_consumer_entities_total{outcome=~\"written|tombstoned|redirected\"}[5m])) - sum(rate(wikidata_relay_events_total{outcome=~\"dirty|deleted\"}[5m]))",
              "refId": "A",
              "legendFormat": "net drain"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Consumer outcomes (entities/sec)",
          "description": "Per-outcome rate. `written + redirected + tombstoned` is the useful drain. `not_found_left_pending` rows stay in the queue for the next run. `errors` likewise — usually transient 429s.",
          "gridPos": {"x": 0, "y": 25, "w": 24, "h": 8},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2
            }
          },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(wikidata_consumer_entities_total[5m]))",
              "refId": "A",
              "legendFormat": "{{`{{outcome}}`}}"
            }
          ]
        }
      ]
    }
