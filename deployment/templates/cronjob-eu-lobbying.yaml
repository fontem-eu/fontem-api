{{/*
EU Transparency Register (lobbyist disclosures). Loader calls
gmr-consolidator's /resolve service to link Lobbyist → Company; only
confident hits become REPRESENTS edges, fuzzy candidates land on the
manual-review queue (Lobbying tab in EntityResolutionView).

Weekly cadence — lobbyist registrations and updates trickle in
slowly; daily would be wasteful.
*/}}
{{- include "edgar-gmr-etl.cronjob" (dict
      "name"            "etl-eu-lobbying"
      "schedule"        "0 5 * * 1"
      "module"          "src.etl.load_eu_lobbying"
      "args"            (list)
      "deadlineSeconds" 3600
      "cpuRequest"      "250m"
      "cpuLimit"        "1"
      "memRequest"      "512Mi"
      "memLimit"        "2Gi"
      "extraEnv"        (list)
      "Values"          .Values
      "Release"         .Release) -}}
