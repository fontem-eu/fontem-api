{{/*
One-shot bootstrap Job: re-materialise CLIENT_OF / SUPPLIER_OF
once on every chart upgrade.

Why a Helm hook:
  The matching CronJob runs at 09:00 UTC. After a deploy that
  fixes a trade-summary inconsistency (e.g. the eu-LISA bug —
  graph view shows N contracts via stale CLIENT_OF, contracts
  list shows 0 via live AWARDED), waiting up to 24 hours for the
  cron to heal the data is not acceptable when the smoke gate
  asserts `graph_count == contracts_count`. This hook fires
  immediately after `helm upgrade` finishes, runs the same
  materialize module the cron runs, and self-cleans so we don't
  accumulate orphan Job objects.

Idempotent: materialize_trade_edges drops and rebuilds, so
re-running it is safe. If the chart is upgraded with no trade-
edges-related change, the hook still runs but is a near-no-op.

The Job uses the same env wiring as the cron (Neo4j creds via
the shared secret) so credential rotation flows through both.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-trade-edges-bootstrap-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: etl-trade-edges-bootstrap
    component: etl
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    # Run after any other post-upgrade hooks. Negative weight here
    # keeps it out of the way if/when other hooks land.
    "helm.sh/hook-weight": "10"
    # Clean the Job up on the next chart upgrade — keeps the
    # namespace tidy. Failed Jobs stick around so we can inspect.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: etl-trade-edges-bootstrap
        component: etl
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: bootstrap
          image: contribute.void42.internal/fontem/fontem-api:{{ .Values.version }}
          imagePullPolicy: Always
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          command: ["python", "-m", "src.etl.materialize_trade_edges"]
