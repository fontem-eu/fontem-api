apiVersion: v1
kind: ConfigMap
metadata:
  name: fontem-stats-init-sql
  namespace: {{ .Release.Namespace }}
data:
  # Mounted at /docker-entrypoint-initdb.d/ which Postgres' image runs
  # exactly once on a fresh data directory. Idempotent guards everywhere
  # so a re-run on a non-empty volume (rare; Recreate strategy + same
  # PV) doesn't error.
  00-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    CREATE EXTENSION IF NOT EXISTS postgis;
    -- pg_stat_statements + pgstattuple are the workhorses for finding
    -- queries that should have an index, and for spotting bloat.
    -- pg_stat_statements *also* needs `pg_stat_statements` in
    -- shared_preload_libraries (see configmap-postgresql-conf.yaml);
    -- the CREATE EXTENSION here registers the views in the database.
    -- auto_explain is a `_PG_init`-only library — there's no
    -- corresponding CREATE EXTENSION; loading it via
    -- shared_preload_libraries is enough.
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    CREATE EXTENSION IF NOT EXISTS pgstattuple;

    -- hypopg + pg_qualstats: hypothetical-index workflow.
    --   pg_qualstats tracks predicates (column = const, column < const, …)
    --     hit by real queries; reads via pg_qualstats_index_advisor() or
    --     direct SELECT FROM pg_qualstats to find what's worth indexing.
    --     Requires pg_qualstats in shared_preload_libraries (statefulset.yaml).
    --   hypopg creates virtual indexes that show up in EXPLAIN without
    --     paying the cost of building them — try a candidate index, see
    --     if the planner picks it, drop it. Sample workflow:
    --       SELECT hypopg_create_index('CREATE INDEX ON x (y)');
    --       EXPLAIN <query>;
    --       SELECT hypopg_reset();
    CREATE EXTENSION IF NOT EXISTS hypopg;
    CREATE EXTENSION IF NOT EXISTS pg_qualstats;

  10-schema.sql: |
    CREATE SCHEMA IF NOT EXISTS fontem_stats;
    SET search_path = fontem_stats, public;

    -- ── Catalog: every tracked dataset, one row each ────────────
    CREATE TABLE IF NOT EXISTS fontem_stats.dataset (
        code              text         PRIMARY KEY,
        label             text         NOT NULL,
        theme             text         NOT NULL,
        source            text         NOT NULL DEFAULT 'eurostat',
        source_url        text         NOT NULL,
        nuts_levels       smallint[]   NOT NULL,
        dim_ids           text[]       NOT NULL,
        dim_sizes         int[]        NOT NULL,
        dim_labels        jsonb        NOT NULL DEFAULT '{}'::jsonb,
        time_unit         text         NOT NULL DEFAULT 'year',
        update_freq       interval     NOT NULL,
        enabled           boolean      NOT NULL DEFAULT true,
        notes             text,
        created_at        timestamptz  NOT NULL DEFAULT now(),
        updated_at        timestamptz  NOT NULL DEFAULT now()
    );
    -- Idempotent migration for clusters created before dim_labels existed.
    ALTER TABLE fontem_stats.dataset
        ADD COLUMN IF NOT EXISTS dim_labels jsonb NOT NULL DEFAULT '{}'::jsonb;

    -- ── Sync history: one row per loader invocation ─────────────
    CREATE TABLE IF NOT EXISTS fontem_stats.sync_run (
        id                bigserial    PRIMARY KEY,
        dataset_code      text         NOT NULL REFERENCES fontem_stats.dataset(code),
        started_at        timestamptz  NOT NULL DEFAULT now(),
        finished_at       timestamptz,
        status            text         NOT NULL CHECK (status IN
                                         ('running','success','failed','skipped')),
        upstream_modified timestamptz,
        rows_inserted     bigint       DEFAULT 0,
        rows_updated      bigint       DEFAULT 0,
        rows_total        bigint       DEFAULT 0,
        error_message     text
    );
    CREATE INDEX IF NOT EXISTS sync_run_dataset_started_idx
        ON fontem_stats.sync_run (dataset_code, started_at DESC);
    CREATE INDEX IF NOT EXISTS sync_run_alert_idx
        ON fontem_stats.sync_run (status, started_at DESC)
        WHERE status IN ('running','failed');

    -- ── Observations: one universal hypertable for all datasets ─
    CREATE TABLE IF NOT EXISTS fontem_stats.observation (
        dataset_code  text             NOT NULL REFERENCES fontem_stats.dataset(code),
        time          timestamptz      NOT NULL,
        geo_code      text             NOT NULL,
        dimensions    jsonb            NOT NULL DEFAULT '{}'::jsonb,
        value         double precision,
        flags         text[],
        PRIMARY KEY (dataset_code, time, geo_code, dimensions)
    );
    -- 5-year chunks: most queries span 1-10y; this gives 1-2 chunks/query.
    SELECT create_hypertable(
        'fontem_stats.observation', 'time',
        chunk_time_interval => INTERVAL '5 years',
        if_not_exists => TRUE
    );
    CREATE INDEX IF NOT EXISTS observation_dataset_geo_time_idx
        ON fontem_stats.observation (dataset_code, geo_code, time DESC);
    CREATE INDEX IF NOT EXISTS observation_geo_time_idx
        ON fontem_stats.observation (geo_code, time DESC)
        INCLUDE (dataset_code, value);
    CREATE INDEX IF NOT EXISTS observation_dimensions_gin
        ON fontem_stats.observation USING GIN (dimensions jsonb_path_ops);

    -- Compress old data after a year. Re-runs are safe: ALTER and
    -- add_compression_policy both no-op when already configured.
    DO $$ BEGIN
        ALTER TABLE fontem_stats.observation SET (
            timescaledb.compress,
            timescaledb.compress_segmentby = 'dataset_code, geo_code',
            timescaledb.compress_orderby   = 'time DESC'
        );
    EXCEPTION WHEN others THEN NULL; END $$;

    DO $$ BEGIN
        PERFORM add_compression_policy('fontem_stats.observation',
            INTERVAL '1 year');
    EXCEPTION WHEN duplicate_object THEN NULL;
                 WHEN others THEN NULL; END $$;

    -- ── Per-(dataset, slice) value statistics ──────────────────
    -- Powers the Atlas legend + stable cross-year colour scale. One
    -- row per (dataset_code, dimension slice) — e.g. crim_off_cat
    -- has one row for {iccs:ICCS0101, unit:NR} and another for
    -- {iccs:ICCS0101, unit:P_HTHAB} because the value range is wildly
    -- different. `slice_key` is md5(canonical-jsonb-text) — jsonb's
    -- ::text cast is stable-ordered, so the hash is reproducible from
    -- either Python or SQL.
    CREATE TABLE IF NOT EXISTS fontem_stats.dataset_slice_stats (
        dataset_code      text     NOT NULL REFERENCES fontem_stats.dataset(code) ON DELETE CASCADE,
        slice_key         text     NOT NULL,
        dimensions        jsonb    NOT NULL DEFAULT '{}'::jsonb,
        value_min         double precision,
        value_max         double precision,
        value_p02         double precision,
        value_p50         double precision,
        value_p98         double precision,
        observation_count bigint   NOT NULL DEFAULT 0,
        value_kind        text     NOT NULL DEFAULT 'sequential'
                                   CHECK (value_kind IN ('sequential','diverging')),
        skew_ratio        double precision,
        computed_at       timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (dataset_code, slice_key)
    );
    CREATE INDEX IF NOT EXISTS dataset_slice_stats_dataset_idx
        ON fontem_stats.dataset_slice_stats (dataset_code);

    -- ── Per-dataset aggregate value range ──────────────────────
    -- One row per dataset, aggregating min/max/percentiles + the
    -- observed time window across every slice and every period.
    -- Used by the Atlas catalog ("dataset X spans 0–125 across
    -- 2000–2024") and by "view this dataset across years" to pin
    -- a stable colour scale to the dataset-wide range rather than
    -- recomputing per-year. Cheap relative to slice stats (one
    -- aggregation over `observation` filtered to dataset_code).
    CREATE TABLE IF NOT EXISTS fontem_stats.dataset_stats (
        dataset_code      text     PRIMARY KEY
            REFERENCES fontem_stats.dataset(code) ON DELETE CASCADE,
        value_min         double precision,
        value_max         double precision,
        value_p02         double precision,
        value_p50         double precision,
        value_p98         double precision,
        observation_count bigint   NOT NULL DEFAULT 0,
        time_min          timestamptz,
        time_max          timestamptz,
        value_kind        text     NOT NULL DEFAULT 'sequential'
                                   CHECK (value_kind IN ('sequential','diverging')),
        computed_at       timestamptz NOT NULL DEFAULT now()
    );

    -- ── Per-(dataset, nuts_level, slice, year) coverage ────────
    -- Powers the Atlas "hide low-coverage years/datasets" filter.
    -- One row per (dataset, NUTS level, dimension slice, year)
    -- with the count of regions that carried a non-null value
    -- and the level-wide universe size (max distinct geo_codes
    -- observed at that level across all datasets — robust without
    -- requiring `nuts_region` to be backfilled).
    CREATE TABLE IF NOT EXISTS fontem_stats.dataset_year_availability (
        dataset_code        text     NOT NULL REFERENCES fontem_stats.dataset(code) ON DELETE CASCADE,
        nuts_level          smallint NOT NULL,
        slice_key           text     NOT NULL,
        dimensions          jsonb    NOT NULL DEFAULT '{}'::jsonb,
        year                smallint NOT NULL,
        regions_with_value  int      NOT NULL DEFAULT 0,
        regions_total       int,
        availability_pct    double precision,
        computed_at         timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (dataset_code, nuts_level, slice_key, year)
    );
    CREATE INDEX IF NOT EXISTS dataset_year_availability_dataset_idx
        ON fontem_stats.dataset_year_availability (dataset_code);

    -- ── Level-universe cache ───────────────────────────────────
    --
    -- Denominator for `dataset_year_availability.availability_pct`:
    -- count of distinct regions observable at each NUTS level.
    -- Was previously a CTE inside every per-dataset availability
    -- recompute, full-scanning the observation hypertable 40× per
    -- ETL cycle (~20s mean per call). Now cached here; refreshed
    -- once per cycle by stats_etl.loader.sync_many before the
    -- per-dataset loop. Reads cheap (4-row indexed lookup).
    CREATE TABLE IF NOT EXISTS fontem_stats.level_universe (
        nuts_level  smallint    PRIMARY KEY,
        n           int         NOT NULL,
        computed_at timestamptz NOT NULL DEFAULT now()
    );

    -- ── NUTS regions with PostGIS geometry ──────────────────────
    CREATE TABLE IF NOT EXISTS fontem_stats.nuts_region (
        code         text                          PRIMARY KEY,
        level        smallint                      NOT NULL CHECK (level BETWEEN 0 AND 3),
        name         text                          NOT NULL,
        name_native  text,
        parent_code  text                          REFERENCES fontem_stats.nuts_region(code),
        country_code char(2)                       NOT NULL,
        geometry     geometry(MultiPolygon, 4326)  NOT NULL,
        area_km2     double precision              GENERATED ALWAYS AS
                                                     (ST_Area(geometry::geography) / 1e6) STORED,
        nuts_version text                          NOT NULL,
        valid_from   date                          NOT NULL,
        valid_until  date,
        updated_at   timestamptz                   NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS nuts_region_geom_gix
        ON fontem_stats.nuts_region USING GIST (geometry);
    CREATE INDEX IF NOT EXISTS nuts_region_level_idx
        ON fontem_stats.nuts_region (level);
    CREATE INDEX IF NOT EXISTS nuts_region_parent_idx
        ON fontem_stats.nuts_region (parent_code);
    CREATE INDEX IF NOT EXISTS nuts_region_country_level_idx
        ON fontem_stats.nuts_region (country_code, level);

    -- ── NUTS revision crosswalk ─────────────────────────────────
    CREATE TABLE IF NOT EXISTS fontem_stats.nuts_region_xref (
        from_version text  NOT NULL,
        from_code    text  NOT NULL,
        to_version   text  NOT NULL,
        to_code      text  NOT NULL,
        relation     text  NOT NULL CHECK (relation IN
                       ('identical','renamed','split','merged','absorbed')),
        PRIMARY KEY (from_version, from_code, to_version, to_code)
    );

    -- ── Permissions ────────────────────────────────────────────
    -- The application role owns its schema; DDL via Alembic-style
    -- migrations later, not by privileged users.
    GRANT ALL ON SCHEMA fontem_stats TO {{ .Values.database.user }};
    GRANT ALL ON ALL TABLES IN SCHEMA fontem_stats TO {{ .Values.database.user }};
    GRANT ALL ON ALL SEQUENCES IN SCHEMA fontem_stats TO {{ .Values.database.user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA fontem_stats
        GRANT ALL ON TABLES TO {{ .Values.database.user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA fontem_stats
        GRANT ALL ON SEQUENCES TO {{ .Values.database.user }};
