apiVersion: v1
kind: ConfigMap
metadata:
  name: fontem-stats-postgresql-conf
  namespace: {{ .Release.Namespace }}
data:
  # Custom postgresql.conf snippets, included from the image's main config
  # via /etc/postgresql/conf.d/. Keeps everything else at TimescaleDB
  # defaults. Tuned for a small workload: bulk inserts overnight, the
  # occasional analytical scan during the day.
  custom.conf: |
    # ── Memory ─────────────────────────────────────────────────────
    shared_buffers = {{ .Values.pgConfig.shared_buffers | default "128MB" }}
    work_mem = {{ .Values.pgConfig.work_mem | default "8MB" }}
    maintenance_work_mem = {{ .Values.pgConfig.maintenance_work_mem | default "64MB" }}
    effective_cache_size = {{ .Values.pgConfig.effective_cache_size | default "384MB" }}
    max_connections = {{ .Values.pgConfig.max_connections | default "50" }}

    # ── WAL ───────────────────────────────────────────────────────
    # Single-replica, derivative data. We can rebuild from Eurostat
    # if we ever lose the volume; no need for streaming replication.
    wal_level = {{ .Values.pgConfig.wal_level | default "minimal" | quote }}
    max_wal_senders = {{ .Values.pgConfig.max_wal_senders | default "0" }}
    archive_mode = {{ .Values.pgConfig.archive_mode | default "off" | quote }}

    # ── TimescaleDB / extensions ──────────────────────────────────
    # `pg_stat_statements` — query-level cumulative stats (count, total
    # time, mean time, rows, blocks read). The single most useful tool
    # for finding "should this have an index?" — sort by total_exec_time
    # or by mean_exec_time and the offenders surface immediately.
    # `auto_explain` — emits EXPLAIN output to the postgres log for any
    # query that crosses the duration threshold. With timescaledb +
    # pg_stat_statements + auto_explain, *both* the histogram-of-pain
    # and the per-query plan are available without instrumenting the
    # app.
    shared_preload_libraries = 'timescaledb,pg_stat_statements,auto_explain'

    # ── pg_stat_statements ────────────────────────────────────────
    pg_stat_statements.max = 10000           # rotate FIFO, plenty of room
    pg_stat_statements.track = all           # also track nested (inside funcs)
    pg_stat_statements.track_utility = off   # skip CREATE/ALTER/etc.
    pg_stat_statements.save = on             # persist across pod restarts

    # ── auto_explain ──────────────────────────────────────────────
    # Threshold matches log_min_duration_statement so the slow-query
    # line and its EXPLAIN land together. log_analyze adds runtime
    # measurements at a small overhead — acceptable for a low-QPS
    # analytical workload.
    auto_explain.log_min_duration = 1000     # ms
    auto_explain.log_analyze = on
    auto_explain.log_buffers = on
    auto_explain.log_timing = on
    auto_explain.log_nested_statements = on
    auto_explain.log_format = json
    auto_explain.sample_rate = 1.0

    # ── I/O timing ───────────────────────────────────────────────
    # Cheap on Linux post-2.6, lets pg_stat_statements split shared-
    # block read time from CPU time. Without it `total_exec_time` is
    # one opaque number.
    track_io_timing = on

    # ── Logging ───────────────────────────────────────────────────
    log_min_duration_statement = 1000   # ms — slow query log
    log_line_prefix = '%t [%p] %u@%d '
    log_lock_waits = on
