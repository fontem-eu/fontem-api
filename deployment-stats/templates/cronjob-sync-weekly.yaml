# Weekly full sweep — touches every enabled dataset regardless of the
# upstream-modified shortcut. Catches drift on datasets whose `updated`
# header hasn't changed even though the underlying data did.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fontem-stats-sync-weekly
  namespace: {{ .Release.Namespace }}
  labels:
    app: fontem-stats-sync
    cadence: weekly
spec:
  schedule: {{ .Values.cronjobs.weekly.schedule | default "0 4 * * 0" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.cronjobs.weekly.deadlineSeconds | default 7200 }}
      template:
        metadata:
          labels:
            app: fontem-stats-sync
            cadence: weekly
            component: etl
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: sync
              image: "{{ .Values.cronjobs.imageRepository }}:{{ .Values.cronjobs.imageTag | required ".Values.cronjobs.imageTag is required" }}"
              env:
                # POSTGRES_PASSWORD must come first — Kubernetes evaluates
                # `$(VAR)` substitutions in env-list declaration order, so
                # the URL referencing it only expands when the variable is
                # already set.
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: POSTGRES_PASSWORD
                - name: STATS_DATABASE_URL
                  value: "postgresql+asyncpg://{{ .Values.database.user }}:$(POSTGRES_PASSWORD)@fontem-stats-postgres:5432/{{ .Values.database.name }}"
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.kumaSecretName | default "fontem-stats-kuma" }}
                      key: kuma_push_url_weekly
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 1Gi }
                limits: { cpu: "1", memory: 4Gi }
              volumeMounts:
                - name: datasets
                  mountPath: /etc/fontem-stats
                  readOnly: true
                - name: run-logs
                  mountPath: /run-logs
              # No shell: the ETL image is Chainguard (no /bin/sh, no curl)
              # since 2026-09-01, and the script that used to live here died
              # with `StartError: exec "/bin/sh"` on every run (gitops #543).
              # src/stats_etl/cron.py does the same steps — seed, polygons,
              # sync — streams its output live, and pushes Uptime Kuma
              # up/down at the end, deadline kills included.
              command: ["python", "-m", "src.stats_etl.cron"]
              args:
                - weekly
                - "--datasets-file"
                - /etc/fontem-stats/datasets.txt
                - "--log-dir"
                - /run-logs
          {{- with .Values.nodeSelector }}
          # Pinned like the statefulset so the hostPath log lands on a
          # known node set.
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          # The nodeSelector above is only half of it: the production
          # nodes carry void42.internal/role=prod:NoSchedule, so a pod
          # selected onto them and unable to tolerate that taint is
          # unschedulable — 0/4 nodes, forever, with no pod and no log to
          # look at. That is what happened here: the selector was
          # rendered and the toleration was not, so the weekly sync sat
          # Pending while the daily (which pins nothing, so it lands on
          # an untainted node) kept working. The statefulset renders both
          # and is the shape to match.
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: datasets
              configMap:
                name: fontem-stats-datasets
                items:
                  - key: datasets.txt
                    path: datasets.txt
            - name: run-logs
              hostPath:
                path: /var/log/fontem-stats-sync
                type: DirectoryOrCreate
