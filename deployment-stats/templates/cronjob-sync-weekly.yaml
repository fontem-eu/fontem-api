# Weekly full sweep — touches every enabled dataset regardless of the
# upstream-modified shortcut. Catches drift on datasets whose `updated`
# header hasn't changed even though the underlying data did.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fontem-stats-sync-weekly
  namespace: {{ .Release.Namespace }}
  labels:
    app: fontem-stats-sync
    cadence: weekly
spec:
  schedule: {{ .Values.cronjobs.weekly.schedule | default "0 4 * * 0" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.cronjobs.weekly.deadlineSeconds | default 7200 }}
      template:
        metadata:
          labels:
            app: fontem-stats-sync
            cadence: weekly
            component: etl
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: sync
              image: "{{ .Values.cronjobs.imageRepository }}:{{ .Values.cronjobs.imageTag | required ".Values.cronjobs.imageTag is required" }}"
              env:
                # POSTGRES_PASSWORD must come first — Kubernetes evaluates
                # `$(VAR)` substitutions in env-list declaration order, so
                # the URL referencing it only expands when the variable is
                # already set.
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: POSTGRES_PASSWORD
                - name: STATS_DATABASE_URL
                  value: "postgresql+asyncpg://{{ .Values.database.user }}:$(POSTGRES_PASSWORD)@fontem-stats-postgres:5432/{{ .Values.database.name }}"
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.kumaSecretName | default "fontem-stats-kuma" }}
                      key: kuma_push_url_weekly
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 1Gi }
                limits: { cpu: "1", memory: 4Gi }
              volumeMounts:
                - name: datasets
                  mountPath: /etc/fontem-stats
                  readOnly: true
                - name: run-logs
                  mountPath: /run-logs
              command: ["/bin/sh", "-c"]
              args:
                - |
                  KUMA_STATUS=down
                  KUMA_SUMMARY=unknown
                  push_kuma() {
                    [ -z "$KUMA_PUSH_URL" ] && return 0
                    curl -fsS -m 10 "$KUMA_PUSH_URL?status=$KUMA_STATUS&msg=$KUMA_SUMMARY&ping=" || true
                  }
                  trap push_kuma EXIT
                  # Everything below streams through tee into a hostPath
                  # file as it happens. The old form captured the whole
                  # sync in a shell variable and echoed it at the END — so
                  # when activeDeadlineSeconds killed the run (and the job
                  # controller deleted the pod), there was no log
                  # anywhere: not in kubectl, not on disk. Three weekly
                  # runs died at the deadline with zero diagnostics before
                  # this was noticed (2026-08 sweep). The node file
                  # survives the pod; find it under
                  # /var/log/fontem-stats-sync on the pinned nodes.
                  LOG=/run-logs/weekly-$(date -u +%Y%m%dT%H%M%SZ).log
                  {
                    echo "run start $(date -u +%FT%TZ)"
                    # Re-register seeds with the env's dataset filter
                    # before the full reconcile — if the daily has been
                    # failing for a while, the weekly is the path that
                    # picks up dataset-list changes from the ConfigMap.
                    python -m src.stats_etl register-seed \
                      --from-file /etc/fontem-stats/datasets.txt 2>&1
                    python -m src.stats_etl sync --all --force 2>&1
                    echo "$?" > /tmp/rc
                    echo "run end $(date -u +%FT%TZ) rc=$(cat /tmp/rc)"
                  } | tee "$LOG"
                  rc=$(cat /tmp/rc 2>/dev/null || echo 1)
                  KUMA_SUMMARY=$(grep -oE '[0-9]+ synced|[0-9]+ skipped|[0-9]+ failed' "$LOG" \
                    | tr '\n' ' ' | sed 's/ $//' | tr ' ' '+')
                  KUMA_SUMMARY=${KUMA_SUMMARY:-unknown}
                  [ "$rc" -eq 0 ] && KUMA_STATUS=up
                  exit $rc
          {{- with .Values.nodeSelector }}
          # Pinned like the statefulset so the hostPath log lands on a
          # known node set.
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: datasets
              configMap:
                name: fontem-stats-datasets
                items:
                  - key: datasets.txt
                    path: datasets.txt
            - name: run-logs
              hostPath:
                path: /var/log/fontem-stats-sync
                type: DirectoryOrCreate
