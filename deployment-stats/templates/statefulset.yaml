apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fontem-stats-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    # No service mesh injection — Postgres traffic is intra-cluster only,
    # consumers connect via the ClusterIP service. Linkerd adds latency
    # we don't need on bulk inserts.
    linkerd.io/inject: disabled
spec:
  serviceName: fontem-stats-postgres
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: fontem-stats-postgres
  # No rolling — single replica, recreate on update so we never have
  # two pods racing on the same NFS PV.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fontem-stats-postgres
      annotations:
        linkerd.io/inject: disabled
        # Restart pod when initdb scripts ConfigMap changes — the
        # *.sql files only run on a fresh data dir, but mounting the
        # latest version means a re-init from a wiped PV picks up the
        # current schema rather than whatever was committed at chart
        # install time.
        checksum/init-sql: {{ include (print $.Template.BasePath "/configmap-init-sql.yaml") . | sha256sum }}
        # Roll the pod whenever the StatefulSet's args change too —
        # the pg-conf ConfigMap is gone (settings moved to args), so
        # what used to be `checksum/pg-conf` now collapses into the
        # StatefulSet's own template hash, which Kubernetes already
        # tracks. No explicit checksum needed here.
    spec:
      securityContext:
        # timescale/timescaledb-ha:pg16 ships with the postgres user as
        # uid 1000 (NOT 999 like the upstream library/postgres image).
        # `docker inspect` confirms `User=postgres → uid=1000`. fsGroup
        # is here for the local-backed-PV path (kubelet recursively
        # chowns); on NFS it's a no-op and the initContainer below
        # carries the actual fix.
        fsGroup: 1000
      initContainers:
        # One-shot chown so the NFS-backed PV is writable by the
        # postgres user (uid 1000). Runs as root inside the pod and
        # writes through the NFS export's `no_root_squash`. Idempotent:
        # re-runs are a no-op once ownership already matches.
        - name: chown-data
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "chown 1000:1000 on /var/lib/postgresql/data (NFS mount)"
              chown -R 1000:1000 /var/lib/postgresql/data || \
                find /var/lib/postgresql/data -mindepth 1 -exec chown 1000:1000 {} + || :
              chmod 700 /var/lib/postgresql/data
              echo "ready: $(stat -c '%u:%g %a' /var/lib/postgresql/data)"

              # Smoke-check: actually try to write to the data dir as
              # uid 1000 (the postgres user inside the timescaledb-ha
              # image). Catches the class of mismatch where the chart
              # is targeting a different uid than the running image —
              # the actual bug that took us 3 deploys to find. Failing
              # here gives a clear, named error instead of an opaque
              # "mkdir: Permission denied" buried in postgres logs.
              adduser -D -u 1000 -H -s /bin/sh pgtest 2>/dev/null || true
              if ! su -s /bin/sh pgtest -c 'touch /var/lib/postgresql/data/.smoke && rm /var/lib/postgresql/data/.smoke'; then
                echo "::error:: uid 1000 cannot write to /var/lib/postgresql/data."
                echo "  Likely cause: the configured fsGroup/initContainer chown does"
                echo "  not match the image's runtime user. Verify with:"
                echo "    docker inspect docker.io/timescale/timescaledb-ha:{{ .Values.image.tag }} \\"
                echo "      --format '{{ "{{" }}.Config.User{{ "}}" }}'"
                exit 1
              fi
              echo "uid 1000 write-check OK"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
      containers:
        - name: postgres
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          # Apply our custom settings via individual `-c name=value`
          # flags. We discovered the hard way that
          # `-c include_dir=…` is rejected ("unrecognized configuration
          # parameter") — `include_dir` is a config-file-only
          # directive, not a regular GUC. Per-setting `-c` is the
          # most direct, no-mutation-of-PGDATA way to make these
          # values actually take effect.
          #
          # NB: extension-namespaced GUCs (`pg_stat_statements.*`,
          # `auto_explain.*`) are accepted at parse time even before
          # the modules load, because Postgres treats anything with
          # a `.` as a custom variable.
          args:
            - postgres
            # Extensions loaded at startup. Adding pg_stat_statements
            # + auto_explain alongside the existing timescaledb.
            - -c
            - shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain
            # Memory + connections — keep the chart's default values
            # in lockstep with values.yaml's pgConfig.* (omitted here:
            # the timescaledb-ha image already picks reasonable
            # defaults from postgresql.conf, our custom settings only
            # override what we want different).
            # I/O timing — splits CPU vs disk read time in stats.
            - -c
            - track_io_timing=on
            # Slow query log + plan log paired at the same threshold,
            # so the histogram-of-pain (pg_stat_statements) and the
            # per-query plan (auto_explain) land together in pod logs.
            - -c
            - log_min_duration_statement=1000
            - -c
            - log_lock_waits=on
            - -c
            - log_line_prefix=%t [%p] %u@%d
            # pg_stat_statements knobs.
            - -c
            - pg_stat_statements.max=10000
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.track_utility=off
            - -c
            - pg_stat_statements.save=on
            # auto_explain knobs. Threshold matches
            # log_min_duration_statement above.
            - -c
            - auto_explain.log_min_duration=1000
            - -c
            - auto_explain.log_analyze=on
            - -c
            - auto_explain.log_buffers=on
            - -c
            - auto_explain.log_timing=on
            - -c
            - auto_explain.log_nested_statements=on
            - -c
            - auto_explain.log_format=json
            - -c
            - auto_explain.sample_rate=1.0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.database.user }}", "-d", "{{ .Values.database.name }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.database.user }}", "-d", "{{ .Values.database.name }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: fontem-stats-init-sql
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.storage.storageClassName }}
        # Dynamic provisioning via the named StorageClass — the PVC
        # will land on whichever node the pod is scheduled to (with
        # local-path it follows the pod's nodeSelector).
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- else }}
        # Empty storageClassName matches a manually-provisioned PV
        # (NFS in dev/dast/staging). volumeName binds it explicitly.
        storageClassName: ""
        volumeName: {{ .Values.storage.volumeName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
